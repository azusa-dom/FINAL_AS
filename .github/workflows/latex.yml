name: Build LaTeX

on:
  push:
  pull_request:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeXLive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science latexmk

      - name: Build final.tex
        working-directory: results
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error final.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-pdf
          path: results/final.pdf